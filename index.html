<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <base href="/ultah/">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Happy Birthday Sayanggg 💙</title>
    <meta name="theme-color" content="#b8f3ff" />
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #b8f3ff;
        --blue: #0a8fd6;
        --navy: #0066aa;
        --pink: #e8b9cb;
        --pale: #bcd8ee;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: Fredoka, system-ui, sans-serif;
        color: #0b4f85;
        overflow-x: hidden;
        background: linear-gradient(90deg, #7aaedc40 50%, #0000 50%),
          linear-gradient(#7aaedc40 50%, #0000 50%), #fff;
        background-size: 76px 76px;
      }
      body.locked {
        overflow: hidden;
        height: 100svh;
      }
      .script {
        font-family: 'Dancing Script', cursive;
      }
      section {
        position: relative;
        padding: 56px 20px;
      }
      .sky {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .star {
        position: absolute;
        clip-path: polygon(
          50% 0,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        animation: tw 3s ease-in-out infinite;
      }
      @keyframes tw {
        50% {
          transform: scale(0.55) rotate(40deg);
          opacity: 0.6;
        }
      }
      .bunting {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 84px;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
        z-index: 2;
      }
      .bunting:before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        border-top: 2px solid #9a8a78;
      }
      .bunting i {
        width: 44px;
        height: 62px;
        margin-top: 8px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
        transform-origin: top;
        animation: sway 3s ease-in-out infinite;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
      .bub {
        font-weight: 700;
        color: var(--sky);
        -webkit-text-stroke: 9px var(--blue);
        paint-order: stroke fill;
        filter: drop-shadow(0 4px 0 #fff);
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .wave span {
        display: inline-block;
        animation: bob 1.7s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-12px) rotate(-4deg);
        }
      }
      /* gate */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: linear-gradient(90deg, #7aaedc40 50%, #0000 50%),
          linear-gradient(#7aaedc40 50%, #0000 50%), var(--sky);
        background-size: 76px 76px;
        transition: 0.9s;
      }
      #gate.bye {
        opacity: 0;
        transform: scale(1.2);
        pointer-events: none;
      }
      #gate h2 {
        font-size: clamp(2rem, 9vw, 3.2rem);
        position: relative;
        z-index: 3;
      }
      #gate p {
        margin-top: 8px;
        font-size: 1.05rem;
        animation: pulse 1.6s infinite;
        position: relative;
        z-index: 3;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.07);
        }
      }
      #gift {
        font-size: clamp(5.5rem, 30vw, 8rem);
        line-height: 1;
        position: relative;
        z-index: 3;
        animation: gift 1.8s ease-in-out infinite;
        filter: drop-shadow(0 8px 0 #fff);
      }
      img#gift {
        display: block;
        width: clamp(150px, 52vw, 270px);
        height: auto;
        font-size: 0;
      }
      #gift.pop {
        animation: giftpop 0.9s ease-out forwards;
      }
      @keyframes giftpop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.35) rotate(-8deg);
        }
        100% {
          transform: scale(1.15) rotate(0);
        }
      }
      @keyframes gift {
        0%,
        50%,
        100% {
          transform: none;
        }
        10%,
        30% {
          transform: rotate(-10deg) scale(1.06);
        }
        20%,
        40% {
          transform: rotate(10deg) scale(1.06);
        }
      }
      .btns {
        display: flex;
        gap: 20px;
        margin-top: 30px;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 4;
      }
      .btns button {
        font:
          700 1.2rem Fredoka,
          sans-serif;
        border: 0;
        border-radius: 99px;
        padding: 14px 30px;
        cursor: pointer;
        transition:
          transform 0.3s,
          left 0.35s,
          top 0.35s;
      }
      #yes {
        background: var(--navy);
        color: #fff;
        box-shadow: 0 5px 0 #003f6e;
      }
      #no {
        background: #fff;
        color: var(--navy);
        box-shadow: 0 5px 0 var(--pale);
        z-index: 60;
      }
      /* hero */
      .hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 100px;
      }
      .n19 {
        font-size: clamp(5rem, 26vw, 9rem);
        font-weight: 700;
        color: #7aa7ea;
        -webkit-text-stroke: 8px #fff;
        paint-order: stroke fill;
        text-shadow: 0 7px 0 #3f77c8;
        line-height: 0.9;
        position: relative;
        animation: float 4s ease-in-out infinite;
        z-index: 3;
      }
      .n19:after {
        content: '';
        position: absolute;
        left: 50%;
        top: 100%;
        height: 50px;
        border-left: 2px solid #6a8fc0;
      }
      .dg {
        position: relative;
        display: inline-block;
      }
      .candle {
        position: absolute;
        left: 50%;
        bottom: 86%;
        width: 0.1em;
        height: 0.4em;
        margin-left: -0.05em;
        border-radius: 0.03em;
        cursor: pointer;
        background: repeating-linear-gradient(-45deg, #fff 0 0.05em, var(--pink) 0.05em 0.1em);
        box-shadow:
          0 0.02em 0 #3f77c8,
          inset 0 0 0 0.012em #ffffff99;
        -webkit-text-stroke: 0;
        text-shadow: none;
        transition: transform 0.2s;
      }
      .candle:before {
        content: '';
        position: absolute;
        inset: -0.1em -0.12em -0.02em;
      }
      .candle:hover {
        transform: scale(1.08);
      }
      .candle:after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 100%;
        width: 0.014em;
        height: 0.04em;
        margin-left: -0.007em;
        background: #5a4636;
      }
      .flame {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 0.035em);
        width: 0.075em;
        height: 0.16em;
        margin-left: -0.0375em;
        border-radius: 50% 50% 50% 50%/62% 62% 38% 38%;
        background: radial-gradient(ellipse at 50% 70%, #fff 0 25%, #ffe27a 55%, #ff9a3c 100%);
        box-shadow:
          0 0 0.14em 0.05em #ffd54a99,
          0 0 0.3em 0.1em #ffb74d44;
        transform-origin: 50% 100%;
        animation: flick 0.5s ease-in-out infinite alternate;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .dg:nth-child(2) .flame {
        animation-delay: -0.25s;
      }
      .flame.off {
        opacity: 0;
        transform: scale(0.2);
        animation: none;
      }
      .flame.off:after {
        content: '';
        position: absolute;
        left: 40%;
        bottom: 60%;
        width: 0.02em;
        height: 0.12em;
        background: #ffffffaa;
        border-radius: 0.02em;
        animation: smoke 1.2s ease-out forwards;
      }
      @keyframes flick {
        0% {
          transform: scale(1, 1) rotate(-3deg);
        }
        50% {
          transform: scale(0.92, 1.08) rotate(2deg);
        }
        100% {
          transform: scale(1.05, 0.95) rotate(3deg);
        }
      }
      @keyframes smoke {
        from {
          transform: translateY(0);
          opacity: 0.8;
        }
        to {
          transform: translateY(-0.25em) scaleX(2.5);
          opacity: 0;
        }
      }
      @keyframes float {
        50% {
          transform: translateY(-14px) rotate(2deg);
        }
      }
      .hero h1 {
        font-size: clamp(3.2rem, 15vw, 6.6rem);
        text-align: center;
        margin-top: 34px;
        position: relative;
        z-index: 3;
      }
      .hw {
        width: min(90vw, 500px);
        margin-top: 10px;
        filter: drop-shadow(0 10px 0 #ffffffcc) drop-shadow(0 14px 18px #0a8fd655);
        animation: float 5s ease-in-out infinite;
        position: relative;
        z-index: 3;
      }
      .heart {
        position: relative;
        transition: transform 0.15s;
        cursor: pointer;
      }
      .heart > img:first-child {
        width: 100%;
        height: auto;
        display: block;
      }
      .kue {
        position: absolute;
        left: 50%;
        bottom: -9%;
        width: 38%;
        margin-left: -19%;
        animation: breathe 3s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.06);
        }
      }
      .hero .script {
        font-size: clamp(2.4rem, 11vw, 4rem);
        color: var(--navy);
        margin-top: 6px;
        position: relative;
        z-index: 3;
      }
      #untuk img {
        display: block;
        width: clamp(150px, 46vw, 280px);
        height: auto;
        margin: 0 auto;
        transform-origin: 50% 90%;
        animation: joget 2.6s ease-in-out infinite;
        cursor: pointer;
        filter: drop-shadow(0 5px 0 #ffffffcc);
      }
      #untuk.img span {
        display: none;
      }
      @keyframes joget {
        0%,
        100% {
          transform: rotate(-4deg) scale(1);
        }
        25% {
          transform: translateY(-12px) rotate(3deg) scale(1.05);
        }
        50% {
          transform: rotate(4deg) scale(1);
        }
        75% {
          transform: translateY(-7px) rotate(-3deg) scale(1.04);
        }
      }
      .myboy {
        position: absolute;
        right: 5%;
        bottom: 11%;
        font-size: clamp(2.2rem, 10vw, 3.8rem);
        font-weight: 700;
        line-height: 0.95;
        color: #1565b8;
        -webkit-text-stroke: 5px #fff;
        paint-order: stroke fill;
        transform: rotate(-8deg);
        animation: wig 2.4s ease-in-out infinite;
        z-index: 3;
        text-align: center;
      }
      .myboy img {
        display: block;
        width: clamp(100px, 30vw, 200px);
        height: auto;
        filter: drop-shadow(0 4px 0 #ffffffcc);
      }
      .myboy.img span {
        display: none;
      }
      @keyframes wig {
        50% {
          transform: rotate(-2deg) scale(1.08);
        }
      }
      .bird {
        position: absolute;
        width: clamp(70px, 22vw, 110px);
        animation: hop 2.2s infinite;
        z-index: 3;
      }
      .bird img {
        width: 100%;
        display: block;
      }
      @keyframes hop {
        0%,
        50%,
        100% {
          transform: translateY(0);
        }
        15% {
          transform: translateY(-34px) rotate(-8deg);
        }
        30% {
          transform: translateY(0);
        }
      }
      .down {
        position: absolute;
        bottom: 14px;
        left: 50%;
        font-size: 1.6rem;
        animation: pulse 1.2s infinite;
        z-index: 3;
      }
      .sea {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        overflow: hidden;
        pointer-events: none;
        --flip: 1;
      } /* ikan jalan mundur? ganti --flip:-1 */
      .sea span {
        position: absolute;
        left: -90px;
        animation: swim linear infinite;
        opacity: 0.9;
      }
      .sea img {
        display: block;
        height: var(--h);
        width: auto;
        transform: scaleX(var(--flip));
      }
      @keyframes swim {
        to {
          transform: translateX(calc(100vw + 180px));
        }
      }
      /* ucapan */
      .stamp {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        background: var(--navy);
        padding: 24px;
        filter: drop-shadow(0 8px 0 #0a8fd633);
      }
      .stamp:before,
      .stamp:after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 11px;
        background: radial-gradient(circle at 11px 0, #0000 8px, var(--navy) 8.5px) 0 0/22px 11px
          repeat-x;
        top: -10px;
      }
      .stamp:after {
        bottom: -10px;
        top: auto;
        background: radial-gradient(circle at 11px 11px, #0000 8px, var(--navy) 8.5px) 0 0/22px 11px
          repeat-x;
      }
      .paper {
        background: var(--sky);
        padding: 30px 24px;
        text-align: center;
        line-height: 1.7;
        font-size: 1.1rem;
      }
      .paper h3 {
        font-size: 2.3rem;
        color: var(--navy);
        margin-bottom: 14px;
      }
      .paper p {
        margin: 12px 0;
      }
      .ttd {
        font-size: 1.7rem;
        color: var(--navy);
        margin-top: 18px;
      }
      .rv {
        opacity: 0;
        transform: translateY(18px);
        transition: 0.8s;
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      /* galeri */
      .gal {
        text-align: center;
      }
      .gal h2 {
        font-size: clamp(2.6rem, 12vw, 4.4rem);
      }
      .add {
        display: inline-block;
        margin: 18px 0 26px;
        padding: 14px 26px;
        background: var(--navy);
        color: #fff;
        border-radius: 99px;
        font-weight: 700;
        font-size: 1.05rem;
        cursor: pointer;
        box-shadow: 0 5px 0 #003f6e;
        transition: 0.15s;
      }
      .add:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #003f6e;
      }
      #up {
        display: none;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 22px;
        max-width: 900px;
        margin: 0 auto;
      }
      figure {
        position: relative;
        background: #fff;
        padding: 8px 8px 26px;
        box-shadow: 0 6px 16px #0a4a8a33;
        transform: rotate(var(--r));
        transition: 0.25s;
        animation: pop 0.5s backwards;
      }
      figure:hover {
        transform: rotate(0) scale(1.07);
        z-index: 5;
      }
      figure img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        display: block;
        cursor: zoom-in;
      }
      figure button {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0;
        background: var(--pink);
        color: #7a2447;
        font-size: 18px;
        cursor: pointer;
      }
      @keyframes pop {
        from {
          transform: scale(0.3) rotate(20deg);
          opacity: 0;
        }
      }
      .note {
        max-width: 420px;
        margin: 26px auto 0;
        font-size: 0.85rem;
        opacity: 0.75;
      }
      #lb {
        position: fixed;
        inset: 0;
        background: #06355ccc;
        z-index: 90;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #lb.on {
        display: flex;
      }
      #lb img {
        max-width: 100%;
        max-height: 90svh;
        border: 8px solid #fff;
        border-radius: 4px;
      }
      footer {
        padding: 30px;
        text-align: center;
      }
      .cf {
        position: fixed;
        top: -14px;
        width: 10px;
        height: 14px;
        z-index: 99;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translate(var(--x), 108vh) rotate(720deg);
        }
      }
      .sp {
        position: fixed;
        pointer-events: none;
        z-index: 98;
        font-size: 20px;
        animation: up 0.9s forwards;
      }
      @keyframes up {
        to {
          transform: translateY(-34px) scale(0.2);
          opacity: 0;
        }
      }
      #mus {
        position: fixed;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        z-index: 80;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 0;
        background: var(--navy);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: none;
        box-shadow: 0 4px 0 #003f6e;
      }
      #mus.on {
        display: block;
      }
      #mus.off {
        opacity: 0.5;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body class="locked">
    <svg width="0" height="0" style="position: absolute">
      <clipPath id="h" clipPathUnits="objectBoundingBox">
        <path
          d="M.5,.97C.12,.66 0,.45 0,.28C0,.1 .12,0 .27,0C.38,0 .46,.06 .5,.16C.54,.06 .62,0 .73,0C.88,0 1,.1 1,.28C1,.45 .88,.66 .5,.97Z"
        />
      </clipPath>
    </svg>

    <!-- PEMBUKA: tiup lilin -->
    <div id="gate">
      <div class="bunting"></div>
      <img
        id="gift"
        src="assets/kado.png"
        alt="Kado"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{id:'gift',textContent:'🎁'}))"
      />
      <h2 class="bub wave">Ada kejutan!</h2>
      <p id="tanya">Mau dibuka sekarang?</p>
      <div class="btns"><button id="yes">bukaaa 💙</button><button id="no">gamauu</button></div>
    </div>

    <!-- HERO -->
    <section class="hero" id="top">
      <div class="sky" id="sky"></div>
      <div class="bunting"></div>
      <div class="n19" id="umur">19</div>
      <h1 class="bub wave">Happy<br />Birthday</h1>
      <div class="hw">
        <div class="heart" id="heart">
          <img src="assets/foto-hati.png" alt="Foto kita berdua" /><img
            class="kue"
            src="assets/kue.png"
            alt=""
            onerror="this.remove()"
          />
        </div>
      </div>
      <div class="script" id="untuk">
        <img
          src="assets/sayang.png"
          alt="Sayang"
          onload="this.parentNode.classList.add('img')"
          onerror="this.remove()"
        /><span id="untukTxt">sayang</span>
      </div>
      <div class="myboy">
        <img
          src="assets/my-boy.png"
          alt="My Boy"
          onload="this.parentNode.classList.add('img')"
          onerror="this.remove()"
        /><span>MY<br />BOY</span>
      </div>
      <div class="bird" style="left: 3%; bottom: 9%">
        <img src="assets/burung-kuning.png" alt="" />
      </div>
      <div class="bird" style="right: 2%; top: 18%; animation-delay: -1s">
        <img src="assets/burung-abu.png" alt="" />
      </div>
      <div class="down">↓</div>
      <div class="sea" id="sea"></div>
    </section>

    <!-- UCAPAN -->
    <section>
      <div class="stamp"><div class="paper" id="ucapan"></div></div>
    </section>

    <!-- GALERI -->
    <section class="gal">
      <h2 class="bub wave">Koleksi Foto Kita</h2>
      <label class="add" for="up">＋ Tambah foto</label>
      <input id="up" type="file" accept="image/*" multiple />
      <div id="grid"></div>
      <p class="note">kitaa banyakin lagii koleksi fotonya ya sayaanggg</p>
    </section>
    <footer class="script" style="font-size: 1.6rem; color: var(--navy)">
      💙 made by nazirah with full of lovee 💙
    </footer>
    <audio id="bgm" src="assets/musik.mp3" loop preload="none"></audio>
    <button id="mus" class="off" aria-label="musik">♪</button>
    <div id="lb" onclick="this.classList.remove('on')"><img alt="" /></div>

    <script>
      /* ====== EDIT DI SINI ====== */
      const CONFIG = {
        untuk: 'sayang',
        umur: 19,
        judulUcapan: 'Untuk kamu 💙',
        ucapan: [
          'Selamat ulang tahun yang ke-19, sayang.',
          'Tulis ucapanmu sendiri di sini. Satu baris = satu paragraf.',
          'Setiap paragraf muncul pelan-pelan saat layar di-scroll.',
        ],
        tandaTangan: '— dari aku',
        fotoBawaan: ['assets/galeri/1.png'] /* tambah: "assets/galeri/foto1.jpg", dst */,
      };
      /* ========================== */
      const $ = (s) => document.querySelector(s),
        rnd = (a, b) => Math.random() * (b - a) + a,
        pick = (a) => a[(Math.random() * a.length) | 0];
      $('#umur').innerHTML = [...String(CONFIG.umur)]
        .map(
          (d) =>
            `<span class="dg">${d}<i class="candle" title="Tiup lilin"><b class="flame"></b></i></span>`,
        )
        .join('');
      $('#untukTxt').textContent = CONFIG.untuk;
      $('#ucapan').innerHTML =
        `<h3 class="script rv">${CONFIG.judulUcapan}</h3>` +
        CONFIG.ucapan.map((t) => `<p class="rv">${t}</p>`).join('') +
        `<div class="script ttd rv">${CONFIG.tandaTangan}</div>`;
      document.querySelectorAll('.wave').forEach((e) => {
        e.innerHTML = [...e.innerHTML.replace('<br>', '|')]
          .map((c, i) =>
            c == '|'
              ? '<br>'
              : c.trim()
                ? `<span style="animation-delay:${i * 0.1}s">${c}</span>`
                : ' ',
          )
          .join('');
      });
      document.querySelectorAll('.bunting').forEach((b) => {
        const c = ['#6aa0de', '#cfe3f7', '#2f68b5', '#a9c9ec'];
        for (let i = 0; i < Math.ceil(innerWidth / 64); i++) {
          const f = document.createElement('i');
          f.style.cssText = `background:${c[i % 4]};animation-delay:${-i * 0.4}s`;
          b.append(f);
        }
      });
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('b'),
          z = rnd(16, 44);
        s.className = 'star';
        s.style.cssText = `left:${rnd(0, 96)}%;top:${rnd(0, 95)}%;width:${z}px;height:${z}px;background:${pick(['#2b62b8', '#bcd8ee', '#7ec8f0', '#e8b9cb'])};animation-delay:${-rnd(0, 4)}s`;
        $('#sky').append(s);
      }
      const IKAN = [
        'assets/ikan-1.png',
        'assets/ikan-2.png',
        'assets/ikan-3.png',
        'assets/ikan-4.png',
        'assets/ikan-5.png',
      ]; /* tambah/kurangi sesuai file ikanmu */
      for (let i = 0; i < 6; i++) {
        const s = document.createElement('span');
        s.innerHTML = `<img src="${IKAN[i % IKAN.length]}" alt="" onerror="this.parentNode.remove()">`;
        s.style.cssText = `top:${rnd(0, 40)}px;--h:${rnd(24, 38)}px;animation-duration:${rnd(9, 18)}s;animation-delay:${-rnd(0, 14)}s`;
        $('#sea').append(s);
      }

      function confetti(n) {
        for (let i = 0; i < n; i++) {
          const c = document.createElement('span');
          c.className = 'cf';
          c.style.cssText = `left:${rnd(0, 100)}vw;background:${pick(['#0a8fd6', '#b8f3ff', '#e8b9cb', '#2b62b8', '#fff'])};--x:${rnd(-25, 25)}vw;animation-duration:${rnd(2, 4)}s;animation-delay:${rnd(0, 0.7)}s`;
          document.body.append(c);
          setTimeout(() => c.remove(), 5000);
        }
      }
      /* kata-kata saat tombol "Nggak" kabur — silakan ganti */
      const msgs = [
        'sayang gaa mau? 🥺',
        'tuhh kann tombolnya kabur 🏃',
        'coba pencet lagi sayaang 😝',
        'ini bikinan dedee loh sayang 🥹',
        'pencet buka aja ya sayanggg 💙',
      ];
      let tries = 0,
        lastD = 0;
      const no = $('#no'),
        yes = $('#yes');
      function dodge(e) {
        e.preventDefault();
        e.stopPropagation();
        if (Date.now() - lastD < 250) return;
        lastD = Date.now();
        tries++;
        $('#tanya').textContent = msgs[(tries - 1) % msgs.length];
        no.style.position = 'fixed';
        const w = no.offsetWidth,
          h = no.offsetHeight,
          y = yes.getBoundingClientRect();
        let x,
          t,
          k = 0;
        do {
          x = rnd(12, innerWidth - w - 12);
          t = rnd(70, innerHeight - h - 12);
        } while (
          k++ < 40 &&
          x < y.right + 70 &&
          x + w > y.left - 70 &&
          t < y.bottom + 70 &&
          t + h > y.top - 70
        );
        no.style.left = x + 'px';
        no.style.top = t + 'px';
        no.style.transform = `scale(${Math.max(0.6, 1 - tries * 0.05)}) rotate(${rnd(-12, 12)}deg)`;
        yes.style.transform = `scale(${Math.min(1.6, 1 + tries * 0.08)})`;
      }
      ['pointerenter', 'pointerdown', 'click'].forEach((ev) =>
        no.addEventListener(ev, dodge, { passive: false }),
      );
      const bgm = $('#bgm'),
        mus = $('#mus');
      mus.onclick = () => {
        if (bgm.paused) {
          bgm.play();
          mus.classList.remove('off');
        } else {
          bgm.pause();
          mus.classList.add('off');
        }
      };
      yes.onclick = () => {
        bgm
          .play()
          .then(() => mus.classList.remove('off'))
          .catch(() => {});
        mus.classList.add('on');
        const g = $('#gift');
        if (g.tagName == 'IMG') g.classList.add('pop');
        else g.textContent = '🎉';
        $('#tanya').textContent = 'Yeay! 💙';
        confetti(110);
        setTimeout(() => {
          $('#gate').classList.add('bye');
          document.body.classList.remove('locked');
          setTimeout(() => $('#gate').remove(), 1000);
        }, 900);
      };

      let last = 0;
      addEventListener('pointermove', (e) => {
        const t = Date.now();
        if (t - last > 60) {
          last = t;
          spark(e.clientX, e.clientY);
        }
        $('#heart').style.transform =
          `perspective(700px) rotateY(${(e.clientX / innerWidth - 0.5) * 14}deg) rotateX(${-(e.clientY / innerHeight - 0.5) * 14}deg)`;
      });
      function spark(x, y) {
        const s = document.createElement('span');
        s.className = 'sp';
        s.textContent = pick(['✦', '★', '♥']);
        s.style.cssText = `left:${x}px;top:${y}px;color:${pick(['#0a8fd6', '#7ec8f0', '#e8b9cb'])}`;
        document.body.append(s);
        setTimeout(() => s.remove(), 900);
      }
      $('#heart').onclick = (e) => {
        confetti(40);
        for (let i = 0; i < 8; i++) spark(e.clientX + rnd(-50, 50), e.clientY + rnd(-50, 50));
      };
      /* tiup lilin: klik lilin untuk memadamkan, kalau semua padam -> konfeti lalu menyala lagi */
      document.querySelectorAll('.candle').forEach(
        (c) =>
          (c.onclick = (e) => {
            e.stopPropagation();
            const f = c.querySelector('.flame');
            f.classList.add('off');
            const all = [...document.querySelectorAll('.flame')];
            if (all.every((x) => x.classList.contains('off'))) {
              confetti(70);
              setTimeout(() => all.forEach((x) => x.classList.remove('off')), 3000);
            }
          }),
      );
      $('#untuk').onclick = (e) => {
        for (let i = 0; i < 8; i++) spark(e.clientX + rnd(-60, 60), e.clientY + rnd(-40, 40));
        confetti(25);
      };

      const io = new IntersectionObserver(
        (es) =>
          es.forEach(
            (e) =>
              e.isIntersecting &&
              ((e.target.style.transitionDelay = (e.target.dataset.d || 0) + 's'),
              e.target.classList.add('in')),
          ),
        { threshold: 0.3 },
      );
      document.querySelectorAll('.rv').forEach((e, i) => {
        e.dataset.d = (i % 4) * 0.12;
        io.observe(e);
      });

      /* galeri */
      /* Supabase (opsional): isi supaya foto pengunjung tersimpan online & tampil ke semua orang. Kosong = simpan di perangkat saja seperti semula */
      const SB = {
        url: 'https://blldrgronaeqpzrjukao.supabase.co',
        key: 'sb_publishable_Wv5QSXP06_M9qzomi6aP7w_cb2Hu0uK',
        bucket: 'galeri',
      };
      const sbOn = !SB.url.includes('XXXX');
      const did =
        localStorage.getItem('did') ||
        (() => {
          const v = Math.random().toString(36).slice(2, 10);
          localStorage.setItem('did', v);
          return v;
        })();
      const HD = () => {
        const h = { apikey: SB.key };
        if (SB.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + SB.key;
        return h;
      };
      const pub = (n) => `${SB.url}/storage/v1/object/public/${SB.bucket}/${n}`;
      const KEY = 'galeri-sayang';
      let user = [],
        remote = [],
        sig = '';
      try {
        user = JSON.parse(localStorage.getItem(KEY) || '[]');
      } catch (e) {}
      if (sbOn)
        document.querySelector('.note').textContent =
          'kitaa banyakinn lagi fotonya yaa';
      function save() {
        let full = 0;
        for (;;) {
          try {
            localStorage.setItem(KEY, JSON.stringify(user));
            break;
          } catch (e) {
            if (!user.pop()) break;
            full = 1;
          }
        }
        if (full) alert('Penyimpanan penuh, sebagian foto tidak tersimpan.');
      }
      function render() {
        const g = $('#grid');
        g.innerHTML = '';
        const extra = sbOn
          ? remote.map((n) => ({ s: pub(n), n, own: n.startsWith(did + '_') }))
          : user.map((s, i) => ({ s, i }));
        [...CONFIG.fotoBawaan.map((s) => ({ s })), ...extra].forEach((p, k) => {
          const f = document.createElement('figure');
          f.style.setProperty('--r', (k % 2 ? 1 : -1) * rnd(1, 3) + 'deg');
          f.innerHTML = `<img src="${p.s}" loading="lazy" alt="Foto kita">${p.i != null || p.own ? '<button aria-label="Hapus foto">×</button>' : ''}`;
          f.querySelector('img').onclick = () => {
            $('#lb img').src = p.s;
            $('#lb').classList.add('on');
          };
          const b = f.querySelector('button');
          if (b)
            b.onclick = () => {
              if (p.n) delRemote(p.n);
              else {
                user.splice(p.i, 1);
                save();
                render();
              }
            };
          g.append(f);
        });
      }
      async function loadRemote() {
        if (!sbOn) return;
        try {
          const r = await fetch(`${SB.url}/storage/v1/object/list/${SB.bucket}`, {
            method: 'POST',
            headers: { ...HD(), 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prefix: '',
              limit: 200,
              sortBy: { column: 'created_at', order: 'asc' },
            }),
          });
          const j = await r.json();
          const names = j.filter((x) => x.name && !x.name.startsWith('.')).map((x) => x.name);
          if (names.join() !== sig) {
            sig = names.join();
            remote = names;
            render();
          }
        } catch (e) {}
      }
      async function delRemote(n) {
        if (!confirm('Hapus foto ini?')) return;
        await fetch(`${SB.url}/storage/v1/object/${SB.bucket}/${n}`, {
          method: 'DELETE',
          headers: HD(),
        });
        sig = '';
        loadRemote();
      }
      $('#up').onchange = async (e) => {
        for (const file of e.target.files)
          await new Promise((res) => {
            const im = new Image();
            im.onload = () => {
              const r = Math.min(1, 900 / Math.max(im.width, im.height)),
                c = document.createElement('canvas');
              c.width = im.width * r;
              c.height = im.height * r;
              c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
              URL.revokeObjectURL(im.src);
              if (sbOn)
                c.toBlob(
                  async (b) => {
                    try {
                      await fetch(
                        `${SB.url}/storage/v1/object/${SB.bucket}/${did}_${Date.now()}.jpg`,
                        {
                          method: 'POST',
                          headers: { ...HD(), 'Content-Type': 'image/jpeg' },
                          body: b,
                        },
                      );
                    } catch (x) {
                      alert('Gagal mengunggah 🥲');
                    }
                    res();
                  },
                  'image/jpeg',
                  0.78,
                );
              else {
                user.push(c.toDataURL('image/jpeg', 0.72));
                res();
              }
            };
            im.onerror = res;
            im.src = URL.createObjectURL(file);
          });
        e.target.value = '';
        save();
        if (sbOn) {
          sig = '';
          await loadRemote();
        } else render();
        confetti(30);
      };
      render();
      loadRemote();
      setInterval(loadRemote, 20000);
      document.addEventListener('visibilitychange', () => !document.hidden && loadRemote());
    </script>
  </body>
</html>
