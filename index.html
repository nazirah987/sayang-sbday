<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <base href="/ultah/">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Happy Birthday Sayanggg 💙</title>
    <meta name="theme-color" content="#b8f3ff" />
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #b8f3ff;
        --blue: #0a8fd6;
        --navy: #0066aa;
        --pink: #e8b9cb;
        --pale: #bcd8ee;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: Fredoka, system-ui, sans-serif;
        color: #0b4f85;
        overflow-x: hidden;
        background: linear-gradient(90deg, #7aaedc40 50%, #0000 50%),
          linear-gradient(#7aaedc40 50%, #0000 50%), #fff;
        background-size: 76px 76px;
      }
      body.locked {
        overflow: hidden;
        height: 100svh;
      }
      .script {
        font-family: 'Dancing Script', cursive;
      }
      section {
        position: relative;
        padding: 56px 20px;
      }
      .sky {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .star {
        position: absolute;
        clip-path: polygon(
          50% 0,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        animation: tw 3s ease-in-out infinite;
      }
      @keyframes tw {
        50% {
          transform: scale(0.55) rotate(40deg);
          opacity: 0.6;
        }
      }
      .bunting {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 84px;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
        z-index: 2;
      }
      .bunting:before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        border-top: 2px solid #9a8a78;
      }
      .bunting i {
        width: 44px;
        height: 62px;
        margin-top: 8px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
        transform-origin: top;
        animation: sway 3s ease-in-out infinite;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
      .bub {
        font-weight: 700;
        color: var(--sky);
        -webkit-text-stroke: 9px var(--blue);
        paint-order: stroke fill;
        filter: drop-shadow(0 4px 0 #fff);
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .wave span {
        display: inline-block;
        animation: bob 1.7s ease-in-out infinite;
      }
      /* pembungkus per kata: huruf tidak akan terpisah ke baris bawah */
      .wave .w {
        animation: none;
        white-space: nowrap;
      }
      @keyframes bob {
        50% {
          transform: translateY(-12px) rotate(-4deg);
        }
      }
      /* gate */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: linear-gradient(90deg, #7aaedc40 50%, #0000 50%),
          linear-gradient(#7aaedc40 50%, #0000 50%), var(--sky);
        background-size: 76px 76px;
        transition: 0.9s;
      }
      #gate.bye {
        opacity: 0;
        transform: scale(1.2);
        pointer-events: none;
      }
      #gate h2 {
        font-size: clamp(2rem, 9vw, 3.2rem);
        position: relative;
        z-index: 3;
      }
      #gate p {
        margin-top: 8px;
        font-size: 1.05rem;
        animation: pulse 1.6s infinite;
        position: relative;
        z-index: 3;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.07);
        }
      }
      #gift {
        font-size: clamp(5.5rem, 30vw, 8rem);
        line-height: 1;
        position: relative;
        z-index: 3;
        animation: gift 1.8s ease-in-out infinite;
        filter: drop-shadow(0 8px 0 #fff);
      }
      img#gift {
        display: block;
        width: clamp(150px, 52vw, 270px);
        height: auto;
        font-size: 0;
      }
      #gift.pop {
        animation: giftpop 0.9s ease-out forwards;
      }
      @keyframes giftpop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.35) rotate(-8deg);
        }
        100% {
          transform: scale(1.15) rotate(0);
        }
      }
      @keyframes gift {
        0%,
        50%,
        100% {
          transform: none;
        }
        10%,
        30% {
          transform: rotate(-10deg) scale(1.06);
        }
        20%,
        40% {
          transform: rotate(10deg) scale(1.06);
        }
      }
      .btns {
        display: flex;
        gap: 20px;
        margin-top: 30px;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 4;
      }
      .btns button {
        font:
          700 1.2rem Fredoka,
          sans-serif;
        border: 0;
        border-radius: 99px;
        padding: 14px 30px;
        cursor: pointer;
        transition:
          transform 0.3s,
          left 0.35s,
          top 0.35s;
      }
      #yes {
        background: var(--navy);
        color: #fff;
        box-shadow: 0 5px 0 #003f6e;
      }
      #no {
        background: #fff;
        color: var(--navy);
        box-shadow: 0 5px 0 var(--pale);
        z-index: 60;
      }
      /* hero */
      .hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 100px;
      }
      .n19 {
        font-size: clamp(5rem, 26vw, 9rem);
        font-weight: 700;
        color: #7aa7ea;
        -webkit-text-stroke: 8px #fff;
        paint-order: stroke fill;
        text-shadow: 0 7px 0 #3f77c8;
        line-height: 0.9;
        position: relative;
        animation: float 4s ease-in-out infinite;
        z-index: 3;
      }
      .n19:after {
        content: '';
        position: absolute;
        left: 50%;
        top: 100%;
        height: 50px;
        border-left: 2px solid #6a8fc0;
      }
      .dg {
        position: relative;
        display: inline-block;
      }
      .candle {
        position: absolute;
        left: 50%;
        bottom: 86%;
        width: 0.1em;
        height: 0.4em;
        margin-left: -0.05em;
        border-radius: 0.03em;
        cursor: pointer;
        background: repeating-linear-gradient(-45deg, #fff 0 0.05em, var(--pink) 0.05em 0.1em);
        box-shadow:
          0 0.02em 0 #3f77c8,
          inset 0 0 0 0.012em #ffffff99;
        -webkit-text-stroke: 0;
        text-shadow: none;
        transition: transform 0.2s;
      }
      .candle:before {
        content: '';
        position: absolute;
        inset: -0.1em -0.12em -0.02em;
      }
      .candle:hover {
        transform: scale(1.08);
      }
      .candle:after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 100%;
        width: 0.014em;
        height: 0.04em;
        margin-left: -0.007em;
        background: #5a4636;
      }
      .flame {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 0.035em);
        width: 0.075em;
        height: 0.16em;
        margin-left: -0.0375em;
        border-radius: 50% 50% 50% 50%/62% 62% 38% 38%;
        background: radial-gradient(ellipse at 50% 70%, #fff 0 25%, #ffe27a 55%, #ff9a3c 100%);
        box-shadow:
          0 0 0.14em 0.05em #ffd54a99,
          0 0 0.3em 0.1em #ffb74d44;
        transform-origin: 50% 100%;
        animation: flick 0.5s ease-in-out infinite alternate;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .dg:nth-child(2) .flame {
        animation-delay: -0.25s;
      }
      .flame.off {
        opacity: 0;
        transform: scale(0.2);
        animation: none;
      }
      .flame.off:after {
        content: '';
        position: absolute;
        left: 40%;
        bottom: 60%;
        width: 0.02em;
        height: 0.12em;
        background: #ffffffaa;
        border-radius: 0.02em;
        animation: smoke 1.2s ease-out forwards;
      }
      @keyframes flick {
        0% {
          transform: scale(1, 1) rotate(-3deg);
        }
        50% {
          transform: scale(0.92, 1.08) rotate(2deg);
        }
        100% {
          transform: scale(1.05, 0.95) rotate(3deg);
        }
      }
      @keyframes smoke {
        from {
          transform: translateY(0);
          opacity: 0.8;
        }
        to {
          transform: translateY(-0.25em) scaleX(2.5);
          opacity: 0;
        }
      }
      @keyframes float {
        50% {
          transform: translateY(-14px) rotate(2deg);
        }
      }
      .hero h1 {
        font-size: clamp(3.2rem, 15vw, 6.6rem);
        text-align: center;
        margin-top: 34px;
        position: relative;
        z-index: 3;
      }
      .hw {
        width: min(90vw, 500px);
        margin-top: 10px;
        filter: drop-shadow(0 10px 0 #ffffffcc) drop-shadow(0 14px 18px #0a8fd655);
        animation: float 5s ease-in-out infinite;
        position: relative;
        z-index: 3;
      }
      .heart {
        position: relative;
        transition: transform 0.15s;
        cursor: pointer;
      }
      .heart > img:first-child {
        width: 100%;
        height: auto;
        display: block;
      }
      .kue {
        position: absolute;
        left: 50%;
        bottom: -9%;
        width: 38%;
        margin-left: -19%;
        animation: breathe 3s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.06);
        }
      }
      .hero .script {
        font-size: clamp(2.4rem, 11vw, 4rem);
        color: var(--navy);
        margin-top: 6px;
        position: relative;
        z-index: 3;
      }
      #untuk img {
        display: block;
        width: clamp(150px, 46vw, 280px);
        height: auto;
        margin: 0 auto;
        transform-origin: 50% 90%;
        animation: joget 2.6s ease-in-out infinite;
        cursor: pointer;
        filter: drop-shadow(0 5px 0 #ffffffcc);
      }
      #untuk.img span {
        display: none;
      }
      @keyframes joget {
        0%,
        100% {
          transform: rotate(-4deg) scale(1);
        }
        25% {
          transform: translateY(-12px) rotate(3deg) scale(1.05);
        }
        50% {
          transform: rotate(4deg) scale(1);
        }
        75% {
          transform: translateY(-7px) rotate(-3deg) scale(1.04);
        }
      }
      .myboy {
        position: absolute;
        right: 5%;
        bottom: 11%;
        font-size: clamp(2.2rem, 10vw, 3.8rem);
        font-weight: 700;
        line-height: 0.95;
        color: #1565b8;
        -webkit-text-stroke: 5px #fff;
        paint-order: stroke fill;
        transform: rotate(-8deg);
        animation: wig 2.4s ease-in-out infinite;
        z-index: 3;
        text-align: center;
      }
      .myboy img {
        display: block;
        width: clamp(100px, 30vw, 200px);
        height: auto;
        filter: drop-shadow(0 4px 0 #ffffffcc);
      }
      .myboy.img span {
        display: none;
      }
      @keyframes wig {
        50% {
          transform: rotate(-2deg) scale(1.08);
        }
      }
      .bird {
        position: absolute;
        width: clamp(70px, 22vw, 110px);
        animation: hop 2.2s infinite;
        z-index: 3;
      }
      .bird img {
        width: 100%;
        display: block;
      }
      @keyframes hop {
        0%,
        50%,
        100% {
          transform: translateY(0);
        }
        15% {
          transform: translateY(-34px) rotate(-8deg);
        }
        30% {
          transform: translateY(0);
        }
      }
      .down {
        position: absolute;
        bottom: 14px;
        left: 50%;
        font-size: 1.6rem;
        animation: pulse 1.2s infinite;
        z-index: 3;
      }
      .sea {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        overflow: hidden;
        pointer-events: none;
        --flip: 1;
      } /* ikan jalan mundur? ganti --flip:-1 */
      .sea span {
        position: absolute;
        left: -90px;
        animation: swim linear infinite;
        opacity: 0.9;
      }
      .sea img {
        display: block;
        height: var(--h);
        width: auto;
        transform: scaleX(var(--flip));
      }
      @keyframes swim {
        to {
          transform: translateX(calc(100vw + 180px));
        }
      }
      /* ucapan */
      .stamp {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        background: var(--navy);
        padding: 24px;
        filter: drop-shadow(0 8px 0 #0a8fd633);
      }
      .stamp:before,
      .stamp:after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 11px;
        background: radial-gradient(circle at 11px 0, #0000 8px, var(--navy) 8.5px) 0 0/22px 11px
          repeat-x;
        top: -10px;
      }
      .stamp:after {
        bottom: -10px;
        top: auto;
        background: radial-gradient(circle at 11px 11px, #0000 8px, var(--navy) 8.5px) 0 0/22px 11px
          repeat-x;
      }
      .paper {
        background: var(--sky);
        padding: 30px 24px;
        text-align: center;
        line-height: 1.7;
        font-size: 1.1rem;
        overflow-wrap: break-word;
      }
      .paper h3 {
        font-size: clamp(1.9rem, 8.5vw, 2.3rem);
        color: var(--navy);
        margin-bottom: 14px;
        text-wrap: balance;
      }
      .paper p {
        margin: 12px 0;
        text-wrap: balance;
      }
      .ttd {
        font-size: 1.7rem;
        color: var(--navy);
        margin-top: 18px;
      }
      @media (max-width: 480px) {
        .stamp {
          padding: 14px;
        }
        .paper {
          padding: 26px 16px;
          font-size: 1.05rem;
          line-height: 1.65;
        }
      }
      .rv {
        opacity: 0;
        transform: translateY(18px);
        transition: 0.8s;
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      /* video */
      .gal {
        text-align: center;
        padding-left: 0;
        padding-right: 0;
        padding-bottom: 0;
      }
      .gal h2 {
        font-size: clamp(2rem, 10.5vw, 4rem);
        line-height: 1.15;
        padding: 0 20px;
      }
      .vid {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 30px;
      }
      footer {
        padding: 30px 20px;
        text-align: center;
        font-size: clamp(1.3rem, 5.6vw, 1.8rem);
        line-height: 1.4;
        color: var(--navy);
        text-wrap: balance;
      }
      footer span {
        display: inline-block;
      }
      .cf {
        position: fixed;
        top: -14px;
        width: 10px;
        height: 14px;
        z-index: 99;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translate(var(--x), 108vh) rotate(720deg);
        }
      }
      .sp {
        position: fixed;
        pointer-events: none;
        z-index: 98;
        font-size: 20px;
        animation: up 0.9s forwards;
      }
      @keyframes up {
        to {
          transform: translateY(-34px) scale(0.2);
          opacity: 0;
        }
      }
      #mus {
        position: fixed;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        z-index: 80;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 0;
        background: var(--navy);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: none;
        box-shadow: 0 4px 0 #003f6e;
      }
      #mus.on {
        display: block;
      }
      #mus.off {
        opacity: 0.5;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body class="locked">
    <svg width="0" height="0" style="position: absolute">
      <clipPath id="h" clipPathUnits="objectBoundingBox">
        <path
          d="M.5,.97C.12,.66 0,.45 0,.28C0,.1 .12,0 .27,0C.38,0 .46,.06 .5,.16C.54,.06 .62,0 .73,0C.88,0 1,.1 1,.28C1,.45 .88,.66 .5,.97Z"
        />
      </clipPath>
    </svg>

    <!-- PEMBUKA: tiup lilin -->
    <div id="gate">
      <div class="bunting"></div>
      <img
        id="gift"
        src="assets/kado.png"
        alt="Kado"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{id:'gift',textContent:'🎁'}))"
      />
      <h2 class="bub wave">Ada kejutan!</h2>
      <p id="tanya">Mau dibuka sekarang?</p>
      <div class="btns"><button id="yes">bukaaa 💙</button><button id="no">gamauu</button></div>
    </div>

    <!-- HERO -->
    <section class="hero" id="top">
      <div class="sky" id="sky"></div>
      <div class="bunting"></div>
      <div class="n19" id="umur">19</div>
      <h1 class="bub wave">Happy<br />Birthday</h1>
      <div class="hw">
        <div class="heart" id="heart">
          <img src="assets/foto-hati.png" alt="Foto kita berdua" /><img
            class="kue"
            src="assets/kue.png"
            alt=""
            onerror="this.remove()"
          />
        </div>
      </div>
      <div class="script" id="untuk">
        <img
          src="assets/sayang.png"
          alt="Sayang"
          onload="this.parentNode.classList.add('img')"
          onerror="this.remove()"
        /><span id="untukTxt">sayang</span>
      </div>
      <div class="myboy">
        <img
          src="assets/my-boy.png"
          alt="My Boy"
          onload="this.parentNode.classList.add('img')"
          onerror="this.remove()"
        /><span>MY<br />BOY</span>
      </div>
      <div class="bird" style="left: 3%; bottom: 9%">
        <img src="assets/burung-kuning.png" alt="" />
      </div>
      <div class="bird" style="right: 2%; top: 18%; animation-delay: -1s">
        <img src="assets/burung-abu.png" alt="" />
      </div>
      <div class="down">↓</div>
      <div class="sea" id="sea"></div>
    </section>

    <!-- UCAPAN -->
    <section>
      <div class="stamp"><div class="paper" id="ucapan"></div></div>
    </section>

    <!-- VIDEO -->
    <section class="gal">
      <h2 class="bub wave">i love you,<br />always<br />and all ways 😊</h2>
      <video
        id="vid"
        class="vid"
        src="assets/video.mp4"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      ></video>
    </section>
    <footer class="script">
      <span>💙 made by nazirah</span> <span>with full of lovee 💙</span>
    </footer>
    <audio id="bgm" src="assets/musik.mp3" loop preload="none"></audio>
    <button id="mus" class="off" aria-label="musik">♪</button>

    <script>
      /* ====== EDIT DI SINI ====== */
      const CONFIG = {
        untuk: 'sayang',
        umur: 19,
        judulUcapan: 'Untuk Riyadi, Sayangku 💙',
        ucapan:[
  'Selamat ulang tahun yang ke-19 sayanggg 💙',
  'dede bersyukur bangett bisa jadi bagian dari hidup pian, bisa ngerayain pian, nyayangi pian, sama mencintai pian sampai sekarang ni.',
  'kadang dede suka mikir, ga nyangka bisa sampai di titik ini, bisa ada di samping sayang dan ngerayain hari spesial sayang kaya ini. dede bersyukur bangett sayang 🥹',
  'soalnya sayang memang pantas dirayakan dan pantas mendapat hal hal baik di hidup pian, bukan cuma hari ini, tapi di hari hari seterusnya jugaaa.',
  'makasih yaa sayang udh bertahan sampai sini, terus jadi laki laki yang baik, anak yang baik, sama pasangan yang baik. dede tau pian selalu berusaha buat semuanya, termasuk mengusahakan kita berdua.',
  'walau kadang sayang capee, kadang ada hari hari yang berat, sayang tetap kuat dan tetap berusaha. dede bangga bangett sama pian, sayang💙',
  'dede doain semoga sayang selalu dalam lindungan Tuhan, selalu dapat kebaikan sama rahmat-Nya, dimudahkan semua urusannya, dipertemukan sama hal hal baik, orang orang baik, dan sehat terus yaa sayang.',
  'semoga makin gantengg, makin dewasa, makin sukses, dan makin sayang sama dede 😝',
  'semoga impian pian satu per satu tercapai, impian kita berdua bisa kita wujudin bareng bareng, pelan pelan tapi pasti. dede yakin sama pian dan dede bakal selalu ada nemanin pian.',
  'sekali lagi, selamat ulang tahun yaa sayangkuu cintaaaa. makasih suda lahir ke dunia ni dan jadi pian yang dede kenal.',
  'dede sayang ayang banyak banyakk 💙',
],
        tandaTangan: '— dari ziraaa',
      };
      /* ========================== */
      const $ = (s) => document.querySelector(s),
        rnd = (a, b) => Math.random() * (b - a) + a,
        pick = (a) => a[(Math.random() * a.length) | 0];
      $('#umur').innerHTML = [...String(CONFIG.umur)]
        .map(
          (d) =>
            `<span class="dg">${d}<i class="candle" title="Tiup lilin"><b class="flame"></b></i></span>`,
        )
        .join('');
      $('#untukTxt').textContent = CONFIG.untuk;
      $('#ucapan').innerHTML =
        `<h3 class="script rv">${CONFIG.judulUcapan}</h3>` +
        CONFIG.ucapan.map((t) => `<p class="rv">${t}</p>`).join('') +
        `<div class="script ttd rv">${CONFIG.tandaTangan}</div>`;
      /* teks bergelombang: tiap huruf bergerak, tapi satu kata selalu utuh (tidak terpotong ke baris bawah) */
      document.querySelectorAll('.wave').forEach((e) => {
        let i = 0;
        e.innerHTML = e.innerHTML
          .split(/<br\s*\/?>/i)
          .map((line) =>
            line
              .trim()
              .split(/\s+/)
              .map(
                (w) =>
                  `<span class="w">${[...w]
                    .map((c) => `<span style="animation-delay:${i++ * 0.1}s">${c}</span>`)
                    .join('')}</span>`,
              )
              .join(' '),
          )
          .join('<br>');
      });
      document.querySelectorAll('.bunting').forEach((b) => {
        const c = ['#6aa0de', '#cfe3f7', '#2f68b5', '#a9c9ec'];
        for (let i = 0; i < Math.ceil(innerWidth / 64); i++) {
          const f = document.createElement('i');
          f.style.cssText = `background:${c[i % 4]};animation-delay:${-i * 0.4}s`;
          b.append(f);
        }
      });
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('b'),
          z = rnd(16, 44);
        s.className = 'star';
        s.style.cssText = `left:${rnd(0, 96)}%;top:${rnd(0, 95)}%;width:${z}px;height:${z}px;background:${pick(['#2b62b8', '#bcd8ee', '#7ec8f0', '#e8b9cb'])};animation-delay:${-rnd(0, 4)}s`;
        $('#sky').append(s);
      }
      const IKAN = [
        'assets/ikan-1.png',
        'assets/ikan-2.png',
        'assets/ikan-3.png',
        'assets/ikan-4.png',
        'assets/ikan-5.png',
      ]; /* tambah/kurangi sesuai file ikanmu */
      for (let i = 0; i < 6; i++) {
        const s = document.createElement('span');
        s.innerHTML = `<img src="${IKAN[i % IKAN.length]}" alt="" onerror="this.parentNode.remove()">`;
        s.style.cssText = `top:${rnd(0, 40)}px;--h:${rnd(24, 38)}px;animation-duration:${rnd(9, 18)}s;animation-delay:${-rnd(0, 14)}s`;
        $('#sea').append(s);
      }

      function confetti(n) {
        for (let i = 0; i < n; i++) {
          const c = document.createElement('span');
          c.className = 'cf';
          c.style.cssText = `left:${rnd(0, 100)}vw;background:${pick(['#0a8fd6', '#b8f3ff', '#e8b9cb', '#2b62b8', '#fff'])};--x:${rnd(-25, 25)}vw;animation-duration:${rnd(2, 4)}s;animation-delay:${rnd(0, 0.7)}s`;
          document.body.append(c);
          setTimeout(() => c.remove(), 5000);
        }
      }
      /* kata-kata saat tombol "Nggak" kabur — silakan ganti */
      const msgs = [
        'sayang gaa mau? 🥺',
        'tuhh kann tombolnya kabur 🏃',
        'coba pencet lagi sayaang 😝',
        'ini bikinan dedee loh sayang 🥹',
        'pencet buka aja ya sayanggg 💙',
      ];
      let tries = 0,
        lastD = 0;
      const no = $('#no'),
        yes = $('#yes');
      function dodge(e) {
        e.preventDefault();
        e.stopPropagation();
        if (Date.now() - lastD < 250) return;
        lastD = Date.now();
        tries++;
        $('#tanya').textContent = msgs[(tries - 1) % msgs.length];
        no.style.position = 'fixed';
        const w = no.offsetWidth,
          h = no.offsetHeight,
          y = yes.getBoundingClientRect();
        let x,
          t,
          k = 0;
        do {
          x = rnd(12, innerWidth - w - 12);
          t = rnd(70, innerHeight - h - 12);
        } while (
          k++ < 40 &&
          x < y.right + 70 &&
          x + w > y.left - 70 &&
          t < y.bottom + 70 &&
          t + h > y.top - 70
        );
        no.style.left = x + 'px';
        no.style.top = t + 'px';
        no.style.transform = `scale(${Math.max(0.6, 1 - tries * 0.05)}) rotate(${rnd(-12, 12)}deg)`;
        yes.style.transform = `scale(${Math.min(1.6, 1 + tries * 0.08)})`;
      }
      ['pointerenter', 'pointerdown', 'click'].forEach((ev) =>
        no.addEventListener(ev, dodge, { passive: false }),
      );
      const bgm = $('#bgm'),
        mus = $('#mus'),
        vid = $('#vid');
      vid.muted = true;
      mus.onclick = () => {
        if (bgm.paused) {
          bgm.play();
          mus.classList.remove('off');
        } else {
          bgm.pause();
          mus.classList.add('off');
        }
      };
      yes.onclick = () => {
        bgm
          .play()
          .then(() => mus.classList.remove('off'))
          .catch(() => {});
        vid.play().catch(() => {});
        mus.classList.add('on');
        const g = $('#gift');
        if (g.tagName == 'IMG') g.classList.add('pop');
        else g.textContent = '🎉';
        $('#tanya').textContent = 'Yeay! 💙';
        confetti(110);
        setTimeout(() => {
          $('#gate').classList.add('bye');
          document.body.classList.remove('locked');
          setTimeout(() => $('#gate').remove(), 1000);
        }, 900);
      };
      /* kalau browser menghentikan video (mis. hemat daya), lanjutkan lagi saat halaman terlihat */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && vid.paused) vid.play().catch(() => {});
      });

      let last = 0;
      addEventListener('pointermove', (e) => {
        const t = Date.now();
        if (t - last > 60) {
          last = t;
          spark(e.clientX, e.clientY);
        }
        $('#heart').style.transform =
          `perspective(700px) rotateY(${(e.clientX / innerWidth - 0.5) * 14}deg) rotateX(${-(e.clientY / innerHeight - 0.5) * 14}deg)`;
      });
      function spark(x, y) {
        const s = document.createElement('span');
        s.className = 'sp';
        s.textContent = pick(['✦', '★', '♥']);
        s.style.cssText = `left:${x}px;top:${y}px;color:${pick(['#0a8fd6', '#7ec8f0', '#e8b9cb'])}`;
        document.body.append(s);
        setTimeout(() => s.remove(), 900);
      }
      $('#heart').onclick = (e) => {
        confetti(40);
        for (let i = 0; i < 8; i++) spark(e.clientX + rnd(-50, 50), e.clientY + rnd(-50, 50));
      };
      /* tiup lilin: klik lilin untuk memadamkan, kalau semua padam -> konfeti lalu menyala lagi */
      document.querySelectorAll('.candle').forEach(
        (c) =>
          (c.onclick = (e) => {
            e.stopPropagation();
            const f = c.querySelector('.flame');
            f.classList.add('off');
            const all = [...document.querySelectorAll('.flame')];
            if (all.every((x) => x.classList.contains('off'))) {
              confetti(70);
              setTimeout(() => all.forEach((x) => x.classList.remove('off')), 3000);
            }
          }),
      );
      $('#untuk').onclick = (e) => {
        for (let i = 0; i < 8; i++) spark(e.clientX + rnd(-60, 60), e.clientY + rnd(-40, 40));
        confetti(25);
      };

      const io = new IntersectionObserver(
        (es) =>
          es.forEach(
            (e) =>
              e.isIntersecting &&
              ((e.target.style.transitionDelay = (e.target.dataset.d || 0) + 's'),
              e.target.classList.add('in')),
          ),
        { threshold: 0.3 },
      );
      document.querySelectorAll('.rv').forEach((e, i) => {
        e.dataset.d = (i % 4) * 0.12;
        io.observe(e);
      });
    </script>
  </body>
</html>
